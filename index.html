<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<title>Escucha social — Misiones</title>
<style>
:root{color-scheme:light dark;--pa:#f7f7f5;--su:#fff;--ink:#121212;
 --ink2:#56554f;--mut:#8a8880;--bor:rgba(0,0,0,.14);--neg:#c0392b}
@media(prefers-color-scheme:dark){:root{--pa:#0f0f0f;--su:#1a1a19;--ink:#f2f2ef;
 --ink2:#c0bfb8;--mut:#8a8880;--bor:rgba(255,255,255,.16);--neg:#e66767}}
*{box-sizing:border-box}
body{margin:0;background:var(--pa);color:var(--ink);display:grid;
 place-items:center;min-height:100vh;padding:20px;
 font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.c{background:var(--su);border:1px solid var(--bor);border-radius:14px;
 padding:22px;max-width:420px;width:100%}
h1{font-size:19px;margin:0 0 4px}
p{color:var(--ink2);font-size:13.5px;margin:0 0 16px}
input{width:100%;padding:11px 12px;font:inherit;border-radius:9px;
 border:1px solid var(--bor);background:var(--pa);color:var(--ink)}
button{width:100%;margin-top:9px;padding:11px;font:inherit;font-weight:600;
 border:0;border-radius:9px;background:var(--ink);color:var(--pa);cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.e{color:var(--neg);font-size:13px;margin-top:10px;min-height:19px}
.n{font-size:12px;color:var(--mut);margin-top:14px;
 border-top:1px solid var(--bor);padding-top:12px}
a{color:inherit}
</style></head><body><div class="c">
<h1>Escucha social — Misiones</h1>
<p>Este panel lleva <b>4,405 citas de comentarios</b> de ciudadanos. Va con
clave para que no lo abra cualquiera que encuentre la dirección.</p>
<form id="f"><input id="p" type="password" placeholder="Frase de acceso"
 autocomplete="current-password" autofocus>
<button id="b" type="submit">Entrar</button></form>
<div class="e" id="e"></div>
<div class="n">Los números generales, sin citas, están abiertos en
 <a href="ficha.html">la ficha</a>.</div>
</div><script>
(function(){
const $=i=>document.getElementById(i);
$("f").addEventListener("submit",async ev=>{
  ev.preventDefault();
  const b=$("b"),e=$("e");
  b.disabled=true;b.textContent="Abriendo…";e.textContent="";
  try{
    const r=await fetch("panel-1791037232.enc");
    if(!r.ok)throw new Error("no se pudo bajar el panel");
    const buf=new Uint8Array(await r.arrayBuffer());
    const salt=buf.slice(0,16),iv=buf.slice(16,28),datos=buf.slice(28);
    const mat=await crypto.subtle.importKey("raw",
      new TextEncoder().encode($("p").value),"PBKDF2",false,["deriveKey"]);
    const k=await crypto.subtle.deriveKey(
      {name:"PBKDF2",salt:salt,iterations:310000,hash:"SHA-256"},
      mat,{name:"AES-GCM",length:256},false,["decrypt"]);
    /* Si la clave esta mal, `decrypt` TIRA: el tag de AES-GCM no cierra. Por
       eso no hace falta guardar ningun hash de la contraseña. */
    const claro=await crypto.subtle.decrypt({name:"AES-GCM",iv:iv},k,datos);
    document.open();document.write(new TextDecoder().decode(claro));
    document.close();
  }catch(err){
    b.disabled=false;b.textContent="Entrar";
    e.textContent="La frase no es correcta.";
    $("p").select();
  }
});
})();
</script></body></html>
